<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxe Radiance - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Manrope", sans-serif;
      }
      h1,
      h2,
      h3,
      h4 {
        font-family: "Noto Serif", serif;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900 h-screen w-screen overflow-hidden">
    <!-- Login Section -->
    <section
      id="login-section"
      class="flex items-center justify-center h-full w-full absolute inset-0 z-50 bg-gray-50"
    >
      <div
        class="bg-white p-10 rounded-2xl shadow-xl max-w-sm w-full border border-gray-100"
      >
        <h2 class="text-3xl mb-8 text-center text-orange-900">Admin Access</h2>
        <form id="login-form" class="space-y-4">
          <div>
            <label
              class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2"
              >Username</label
            >
            <input
              id="username"
              type="text"
              class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-500"
              required
            />
          </div>
          <div>
            <label
              class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2"
              >Password</label
            >
            <input
              id="password"
              type="password"
              class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-500"
              required
            />
          </div>
          <button
            type="submit"
            class="w-full bg-orange-800 text-white font-bold uppercase tracking-widest py-4 rounded-lg hover:bg-orange-900 transition-colors mt-6"
          >
            Login
          </button>
          <p
            id="login-error"
            class="text-red-500 text-sm text-center mt-4 hidden"
          >
            Invalid credentials
          </p>
        </form>
      </div>
    </section>

    <!-- Dashboard Section -->
    <section
      id="dashboard-section"
      class="hidden h-full flex flex-col md:flex-row"
    >
      <!-- Sidebar -->
      <aside
        class="w-full md:w-64 bg-white border-r border-gray-200 flex flex-col"
      >
        <div class="p-6 border-b border-gray-200">
          <h1
            class="text-xl font-bold uppercase tracking-wider text-orange-900"
          >
            LR Admin
          </h1>
        </div>
        <nav class="flex-1 p-4 space-y-2">
          <button
            class="w-full text-left px-4 py-3 bg-orange-50 text-orange-900 rounded-lg font-bold"
          >
            Products
          </button>
        </nav>
        <div class="p-4 border-t border-gray-200">
          <button
            id="logout-btn"
            class="w-full text-left px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors"
          >
            Logout
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 p-8 overflow-y-auto bg-gray-50">
        <div class="flex justify-between items-center mb-8">
          <div>
            <h2 class="text-3xl text-gray-900">Products</h2>
            <p class="text-gray-500 mt-1">Manage your affiliate listings.</p>
          </div>
          <button
            id="open-modal-btn"
            class="bg-orange-800 text-white px-6 py-3 rounded-lg font-bold hover:bg-orange-900 transition-colors"
          >
            + Add Product
          </button>
        </div>

        <!-- Products Table -->
        <div
          class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden"
        >
          <table class="w-full text-left border-collapse">
            <thead>
              <tr
                class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider border-b border-gray-200"
              >
                <th class="px-6 py-4 font-bold">Product</th>
                <th class="px-6 py-4 font-bold">Price</th>
                <th class="px-6 py-4 font-bold">Category</th>
                <th class="px-6 py-4 font-bold">Status</th>
                <th class="px-6 py-4 font-bold text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="products-tbody" class="divide-y divide-gray-100">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </main>
    </section>

    <!-- Add/Edit Product Modal -->
    <div
      id="product-modal"
      class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"
    >
      <div
        class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto"
      >
        <div
          class="p-6 border-b border-gray-100 flex justify-between items-center sticky top-0 bg-white"
        >
          <h3 id="modal-title" class="text-2xl text-orange-900">Add Product</h3>
          <button
            id="close-modal-btn"
            class="text-gray-400 hover:text-gray-600"
          >
            &times;
          </button>
        </div>
        <form id="product-form" class="p-6 space-y-4">
          <input type="hidden" id="prod-id" />
          <div class="grid grid-cols-2 gap-4">
            <div class="col-span-2">
              <label
                class="block text-xs font-bold uppercase text-gray-500 mb-1"
                >Title</label
              >
              <input
                id="prod-title"
                type="text"
                class="w-full px-4 py-2 border rounded-lg"
                required
              />
            </div>
            <div>
              <label
                class="block text-xs font-bold uppercase text-gray-500 mb-1"
                >Price</label
              >
              <input
                id="prod-price"
                type="number"
                step="0.01"
                class="w-full px-4 py-2 border rounded-lg"
                required
              />
            </div>
            <div>
              <label
                class="block text-xs font-bold uppercase text-gray-500 mb-1"
                >Category</label
              >
              <select
                id="prod-category"
                class="w-full px-4 py-2 border rounded-lg"
                required
              >
                <!-- Populated by JS -->
              </select>
            </div>
            <div class="col-span-2">
              <label
                class="block text-xs font-bold uppercase text-gray-500 mb-1"
                >Image URL</label
              >
              <input
                id="prod-image"
                type="url"
                class="w-full px-4 py-2 border rounded-lg"
                required
              />
            </div>
            <div class="col-span-2">
              <label
                class="block text-xs font-bold uppercase text-gray-500 mb-1"
                >Affiliate Link</label
              >
              <input
                id="prod-affiliate"
                type="url"
                class="w-full px-4 py-2 border rounded-lg"
              />
            </div>
            <div class="col-span-2">
              <label
                class="block text-xs font-bold uppercase text-gray-500 mb-1"
                >Description</label
              >
              <textarea
                id="prod-desc"
                rows="3"
                class="w-full px-4 py-2 border rounded-lg"
              ></textarea>
            </div>
            <div class="col-span-2 flex items-center">
              <input
                id="prod-featured"
                type="checkbox"
                class="w-5 h-5 text-orange-600 rounded"
              />
              <label class="ml-2 font-bold text-gray-700"
                >Recommend / Feature</label
              >
            </div>
          </div>
          <div class="pt-4 flex justify-end gap-4">
            <button
              type="button"
              id="cancel-modal-btn"
              class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-50"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-6 py-2 bg-orange-800 text-white rounded-lg hover:bg-orange-900"
            >
              Save Product
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/src/admin.js"></script>
  </body>
</html>
